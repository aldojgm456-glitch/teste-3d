name: Deploy GitHub Pages

# O Pages publica a branch gh-pages; este workflow copia o index.html para lá a cada push.
on:
  push:
    branches: [main, claude/fervent-pascal-ovifag]
    paths: [index.html]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - name: Atualizar gh-pages
        run: |
          cp index.html gh-pages/index.html
          touch gh-pages/.nojekyll
          cd gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou no site."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin gh-pages
